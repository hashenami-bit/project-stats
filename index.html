<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Stats</title>
<meta name="description" content="Personal project status board. Data loads from a private GitHub repo after you connect.">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stats">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,700;0,800;1,800&family=Rajdhani:wght@500;600;700&display=swap">
<style>

/* ===== Skin A: Arena. One job per colour: black ground, dark blue panels, blue progress,
   green healthy/done, yellow level/rank, red danger, purple rarity/energy. ===== */
:root{
  --bg:#EDF1FB; --panel:#FFFFFF; --panel2:#E4EAF9; --line:#C7D1EE; --line2:#A9B7E0;
  --text:#0B1640; --muted:#4A5A8C; --faint:#7C89B5;
  --gold:#A87C00; --yfill:#FFD23F; --cyan:#1F5FD6; --blue:#2F7BFF; --purple:#7A3FE6;
  --good:#0E9F64; --warn:#A87C00; --bad:#E0243F;
  --good-soft:#D4F5E7; --warn-soft:#FFF3C4; --bad-soft:#FFDDE3; --gold-soft:#FFF3C4; --cyan-soft:#DCE8FF;
  --seg-off:#D5DDF3; --track:#D5DDF3; --glow:rgba(122,63,230,.18); --hero1:#DCE5FF; --hero2:#FFFFFF;
  --grid:rgba(11,22,64,.045);
  --display:"Saira Condensed","Rajdhani","Arial Narrow",system-ui,sans-serif;
  --body:"Rajdhani","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#05060B; --panel:#0B1640; --panel2:#12225E; --line:#1B2757; --line2:#2A3A78;
    --text:#EAF0FF; --muted:#8D9AC8; --faint:#5F6C9C;
    --gold:#FFD23F; --yfill:#FFD23F; --cyan:#2F7BFF; --blue:#2F7BFF; --purple:#9B5CFF;
    --good:#2EE59D; --warn:#FFD23F; --bad:#FF3B5C;
    --good-soft:#0C3A2C; --warn-soft:#3A3010; --bad-soft:#3E1224; --gold-soft:#3A3010; --cyan-soft:#10245A;
    --seg-off:#16224F; --track:#0A1233; --glow:rgba(155,92,255,.35); --hero1:#12225E; --hero2:#0B1640;
    --grid:rgba(155,92,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#05060B; --panel:#0B1640; --panel2:#12225E; --line:#1B2757; --line2:#2A3A78;
  --text:#EAF0FF; --muted:#8D9AC8; --faint:#5F6C9C;
  --gold:#FFD23F; --yfill:#FFD23F; --cyan:#2F7BFF; --blue:#2F7BFF; --purple:#9B5CFF;
  --good:#2EE59D; --warn:#FFD23F; --bad:#FF3B5C;
  --good-soft:#0C3A2C; --warn-soft:#3A3010; --bad-soft:#3E1224; --gold-soft:#3A3010; --cyan-soft:#10245A;
  --seg-off:#16224F; --track:#0A1233; --glow:rgba(155,92,255,.35); --hero1:#12225E; --hero2:#0B1640;
  --grid:rgba(155,92,255,.05);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--blue) 14%,transparent),transparent 320px),repeating-linear-gradient(115deg,transparent 0 22px,var(--grid) 22px 23px);
  color:var(--text);font-family:var(--body);font-size:16.5px;line-height:1.45;font-weight:500;padding-inline:16px;padding-block:0 48px;min-height:100%}
.wrap{max-width:1180px;margin:0 auto}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yfill);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-style:italic;font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand-mark{width:28px;height:28px;display:grid;place-items:center;color:var(--gold)}
.brand b{font-family:var(--display);font-style:italic;font-weight:800;font-size:21px;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:13px}
.spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);padding:5px 10px;border:1px solid var(--line);background:var(--panel);text-transform:uppercase;letter-spacing:.06em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.live.on{color:var(--good)}
.live.on i{background:var(--good);box-shadow:0 0 8px var(--good);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.mode{display:inline-flex;border:1px solid var(--line);background:var(--panel)}
.mode button{border:0;background:none;padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:center}
.mode button[aria-pressed="true"]{background:var(--yfill);color:#05060B}

/* panels: slanted HUD plates */
.hud{position:relative;background:linear-gradient(135deg,var(--panel2),var(--panel) 60%);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}

/* hero gauge */
.hero{margin-top:18px;text-align:center;padding:22px 16px 18px;position:relative;
  background:radial-gradient(circle at 50% 36%,var(--glow),transparent 55%),linear-gradient(180deg,var(--hero1),var(--hero2));
  border-top:3px solid var(--yfill);clip-path:polygon(0 0,100% 0,100% 88%,94% 100%,6% 100%,0 88%)}
.gauge{position:relative;width:min(250px,72vw);aspect-ratio:1;margin:0 auto;--r:calc(min(250px,72vw)/2)}
.gauge .ticks{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--muted) 70%,transparent) 0 1.2deg,transparent 1.2deg 7.5deg);
  -webkit-mask:radial-gradient(circle,transparent calc(var(--r) - 11px),#000 calc(var(--r) - 10px),#000 calc(var(--r) - 3px),transparent calc(var(--r) - 2px));
  mask:radial-gradient(circle,transparent calc(var(--r) - 11px),#000 calc(var(--r) - 10px),#000 calc(var(--r) - 3px),transparent calc(var(--r) - 2px));animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gauge .arc{position:absolute;inset:16px;border-radius:50%;
  background:conic-gradient(var(--blue) 0%,var(--purple) calc(var(--v)*.4%),var(--bad) calc(var(--v)*.75%),var(--yfill) calc(var(--v)*1%),var(--seg-off) 0);
  -webkit-mask:radial-gradient(circle,transparent calc(var(--r) - 40px),#000 calc(var(--r) - 39px));mask:radial-gradient(circle,transparent calc(var(--r) - 40px),#000 calc(var(--r) - 39px));
  filter:drop-shadow(0 0 10px var(--glow))}
.gauge .knob{position:absolute;inset:16px;transform:rotate(calc(var(--v)*3.6deg))}
.gauge .knob::before{content:"";position:absolute;left:50%;top:4px;width:14px;height:14px;margin-left:-7px;background:var(--yfill);transform:rotate(45deg);box-shadow:0 0 12px var(--yfill)}
.gauge .core{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.gauge b{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(72px,24vw,100px);line-height:.85;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--text) 35%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.05em}
.gauge b span{font-size:.42em;vertical-align:top;margin-left:2px}
.gauge small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.14em;margin-top:6px;text-transform:uppercase}
.rname{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;color:var(--gold);line-height:1;margin-top:8px;text-transform:uppercase}
.rsub{font-size:14px;color:var(--muted);margin:3px 0 12px}
.xpbar{height:10px;max-width:420px;margin:0 auto;background:var(--track);position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,98% 100%,0 100%)}
.xpbar>i,.meter>i{position:absolute;inset:0 auto 0 0;overflow:hidden;background:linear-gradient(90deg,var(--blue),var(--purple))}
.xpbar>i::after,.meter.xp>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.xpl{display:flex;justify-content:space-between;max-width:420px;margin:5px auto 0;font-size:12.5px;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);padding:9px 6px;text-align:center}
.tile b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:700}
.alert{margin-top:10px;background:var(--bad);color:#fff;font-weight:700;font-size:15px;padding:9px 14px;display:flex;align-items:center;gap:9px;text-decoration:none;
  clip-path:polygon(0 0,100% 0,97% 100%,0 100%);animation:pulse 2.4s infinite}
.alert svg{width:17px;height:17px;flex:none}
@keyframes pulse{50%{filter:brightness(1.2)}}

/* filter tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 4px}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:6px 14px;cursor:pointer;font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;color:var(--muted);text-transform:uppercase;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tabs button[aria-pressed="true"]{background:var(--yfill);color:#05060B;border-color:var(--yfill)}
.tabs button span{font-variant-numeric:tabular-nums;opacity:.7;margin-left:5px}

.section-h{display:flex;align-items:baseline;gap:12px;margin:24px 0 10px}
.section-h h2{font-size:23px;text-transform:uppercase}
.section-h p{color:var(--muted);font-size:14px}
.section-h::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent);align-self:center}

/* project cards */
.grid{display:grid;gap:12px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{display:flex;flex-direction:column;gap:11px;padding:16px 16px 14px 18px;text-decoration:none;border-left:4px solid var(--c,var(--line));transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card-top{display:flex;gap:12px;align-items:center}
.glyph{flex:none;width:50px;height:50px;display:grid;place-items:center;color:var(--c,var(--gold));
  background:color-mix(in srgb,var(--c,var(--gold)) 14%,var(--panel));clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.glyph svg{width:25px;height:25px}
.card h3{font-size:21px;text-transform:uppercase}
.card .cls{color:var(--muted);font-size:13.5px;margin-top:1px}
.card .lv{margin-left:auto;text-align:center;line-height:1}
.card .lv small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}
.card .lv b{font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums}
.tagline{color:var(--muted);font-size:14.5px}
.stagepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 10px;text-transform:uppercase;letter-spacing:.05em;
  background:color-mix(in srgb,currentColor 14%,transparent);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.st-0{color:var(--faint)} .st-1{color:var(--cyan)} .st-2{color:var(--cyan)} .st-3{color:var(--gold)} .st-4{color:var(--good)} .st-p{color:var(--purple)}
.bars{display:grid;gap:7px}
.barrow{display:grid;grid-template-columns:64px 1fr 40px;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.barrow b{font-family:var(--display);font-style:italic;color:var(--text);text-align:right;font-variant-numeric:tabular-nums;font-size:16px}
.meter{height:8px;background:var(--track);position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.meter.hp>i{background:var(--good)} .meter.hp.mid>i{background:var(--warn)} .meter.hp.low>i{background:var(--bad)}
.meter.en>i{background:linear-gradient(90deg,var(--purple),var(--blue))}
.card-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted);font-weight:600}
.flags{display:flex;gap:8px}
.flag{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;font-weight:700}
.dia{width:9px;height:9px;transform:rotate(45deg);display:inline-block;flex:none}
.dia.red{background:var(--bad)} .dia.yellow{background:var(--yfill)} .dia.green{background:var(--good)} .dia.q{background:var(--purple)}
.next{flex-basis:100%;color:var(--text);font-size:14px;font-weight:600}
.next em{font-style:normal;color:var(--gold);font-weight:700;text-transform:uppercase;font-size:12.5px;letter-spacing:.05em}

/* quest board + feed */
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
.panel{padding:18px}
.panel h2{font-size:21px;margin-bottom:4px;text-transform:uppercase}
.panel .hint{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:9px 11px;background:color-mix(in srgb,var(--panel2) 60%,transparent);border-left:3px solid transparent}
.q:has(.dia.red){border-left-color:var(--bad)} .q:has(.dia.yellow){border-left-color:var(--yfill)} .q:has(.dia.green){border-left-color:var(--good)} .q:has(.dia.q){border-left-color:var(--purple)}
.q .dia{margin-top:7px}
.q p{font-size:15px;font-weight:600}
.q small{display:block;color:var(--muted);font-size:12.5px}
.q.done p{text-decoration:line-through;color:var(--faint)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}
.tag:hover{border-color:var(--gold);color:var(--gold)}
.tick{width:22px;height:22px;border:2px solid var(--line2);background:var(--panel);display:grid;place-items:center;cursor:pointer;margin-top:1px;padding:0}
.tick[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#05060B}
.tick svg{width:12px;height:12px}
.feed{list-style:none;margin:0;padding:0;position:relative}
.feed li{position:relative;padding:0 0 14px 22px}
.feed li::before{content:"";position:absolute;left:3px;top:7px;width:8px;height:8px;background:var(--purple);transform:rotate(45deg)}
.feed li::after{content:"";position:absolute;left:7px;top:18px;bottom:0;width:1px;background:var(--line)}
.feed li:last-child::after{display:none}
.feed time{font-family:var(--display);font-style:italic;font-weight:800;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;text-transform:uppercase}
.feed p{font-size:14.5px;font-weight:500}
.feed a{font-weight:700;text-decoration:none;color:var(--cyan)}
.showmore{margin-top:6px;border:1px solid var(--line);background:var(--panel2);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700}

/* project page */
.back{display:inline-flex;align-items:center;gap:8px;margin-top:20px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:700;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);padding:6px 12px}
.back:hover{color:var(--gold);border-color:var(--gold)}
.dhead{margin-top:14px;padding:22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;overflow:hidden;border-left:5px solid var(--c,var(--gold));
  background:radial-gradient(circle at 85% 20%,var(--glow),transparent 50%),linear-gradient(135deg,var(--panel2),var(--panel))}
.dhead>*{position:relative}
.dhead .bgnum{position:absolute;right:-6px;top:50%;transform:translateY(-50%);font-family:var(--display);font-style:italic;font-weight:800;font-size:220px;line-height:.8;
  color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--yfill) 40%,transparent);pointer-events:none}
.dhead .glyph{width:76px;height:76px}
.dhead .glyph svg{width:38px;height:38px}
.dhead h1{font-size:clamp(30px,6vw,48px);text-transform:uppercase}
.dhead .cls{color:var(--muted);margin-top:4px}
.dhead .tagline{margin-top:8px;color:var(--text);max-width:60ch}
.dlv{text-align:center;padding-left:18px;border-left:1px solid var(--line)}
.dlv small{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}
.dlv b{font-family:var(--display);font-style:italic;font-weight:800;font-size:60px;line-height:1;color:var(--gold)}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:10px}
.track div{padding:8px 4px;text-align:center;background:var(--panel);font-size:12.5px;color:var(--faint);font-weight:700;text-transform:uppercase;
  clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%,10% 50%)}
.track div.done{background:var(--blue);color:#fff}
.track div.now{background:var(--yfill);color:#05060B}
.dgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.col{display:grid;gap:12px;min-width:0}
.two>*,.col>*{min-width:0}
.q .tag{white-space:normal;text-align:right}
.prose p{max-width:68ch;margin-top:10px;font-size:16px}
.prose p:first-of-type{margin-top:6px}
.list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:7px}
.list li{position:relative;padding-left:18px;font-size:15.5px}
.list li::before{content:"";position:absolute;left:2px;top:8px;width:7px;height:7px;background:var(--blue);transform:rotate(45deg)}
.gear{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gear span{background:var(--panel2);padding:5px 11px;font-size:14px;font-weight:700;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.gear span small{color:var(--muted);margin-left:5px;font-weight:600}
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.ach div{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--yfill) 10%,var(--panel2));padding:9px 11px;font-size:14.5px;font-weight:600;border-left:3px solid var(--yfill)}
.ach svg{flex:none;width:18px;height:18px;color:var(--gold);margin-top:1px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px}
.statgrid div{background:var(--panel2);padding:9px 11px;border-top:2px solid var(--purple)}
.statgrid b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.statgrid span{font-size:12.5px;color:var(--muted);font-weight:600}
.radar{width:100%;max-width:340px;display:block;margin:4px auto 0}
.radar text{font-family:var(--body);font-size:11.5px;font-weight:700;fill:var(--muted)}
.radar .val{font-family:var(--display);font-size:12px;fill:var(--gold);font-weight:800}
.radar polygon[stroke="var(--gold)"]{stroke:var(--purple)}
.boss{border:1px solid var(--bad);background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 22%,transparent),var(--panel))}
.boss h2{color:var(--bad)}
.nextmove{border-left:4px solid var(--yfill)}
.nextmove h2{color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:10px;font-size:14.5px}
.kv dt{color:var(--muted);font-weight:700} .kv dd{margin:0;word-break:break-word}
pre{margin:10px 0 0;padding:12px;background:var(--track);border:1px solid var(--line);overflow-x:auto;font-size:13px;line-height:1.55}
code{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* editor */
.editor{border:1px solid var(--blue)}
.editor h2{color:var(--cyan)}
.field{display:grid;gap:4px;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--muted)}
.field select,.field input[type=text],.field input[type=password],.field textarea{background:var(--track);border:1px solid var(--line);padding:8px 10px;font-size:15px;font-weight:600;width:100%}
.field input[type=range]{width:100%;accent-color:var(--yfill)}
.row{display:flex;gap:10px;align-items:center}
.btn{border:0;background:var(--yfill);color:#05060B;font-weight:800;padding:9px 18px;cursor:pointer;font-family:var(--display);font-style:italic;font-size:16px;text-transform:uppercase;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.btn:disabled{opacity:.5;cursor:default}
.saved{font-size:13px;font-weight:700;color:var(--good)}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.foot{margin-top:34px;color:var(--faint);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}

@media (max-width:1000px){
  .grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.dgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:680px){
  .grid.g2,.grid.g3{grid-template-columns:1fr}
  .tiles{gap:5px} .tile b{font-size:24px} .tile span{font-size:11px}
  .dhead{grid-template-columns:auto 1fr;padding:18px}
  .dhead .bgnum{font-size:170px}
  .dlv{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:10px 0 0;display:flex;gap:10px;align-items:baseline}
  .track div{font-size:10.5px;padding:6px 2px}
  .ach,.statgrid{grid-template-columns:1fr 1fr}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- app additions ---- */
[hidden]{display:none!important}
img{max-width:100%}
html{height:100%}
body{margin:0}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.bar{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.iconbtn{border:1px solid var(--line);background:var(--panel);width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn svg{width:16px;height:16px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.live.warn i{background:var(--warn)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;text-decoration:none;color:var(--faint);font-size:11.5px;font-weight:600;font-family:var(--display);position:relative}
.tabbar a svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--gold)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;background:var(--gold)}
.tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;font-family:var(--body)}
.connect{max-width:560px;margin:28px auto 0;padding:22px}
.connect h1{font-size:28px}
.connect ol{margin:12px 0 0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.connect code{font-size:13px;background:var(--panel2);padding:1px 5px;border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.ghbox{margin-top:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);font-size:14px}
.ghbox b{font-family:var(--display)}
.ghbox a{color:var(--cyan)}
.newrepo{padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.newrepo b{font-family:var(--display);font-size:16px}
.newrepo span{color:var(--muted);font-size:13.5px}
.setrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line2)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
@media (max-width:680px){ .bar .brand b{font-size:16px} .mode button{padding:5px 8px} }

<script>
(function(){
'use strict';

/* This page holds NO project data. It loads status.json from a private
   GitHub repo using a token that stays in this device's storage only. */

var DEFAULTS = {owner:'hashenami-bit', repo:'project-stats-data', path:'status.json'};
var G = {
  hospital:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/><circle cx="16" cy="9" r="2"/>',
  net:'<rect x="9" y="2" width="6" height="5"/><rect x="2" y="17" width="6" height="5"/><rect x="16" y="17" width="6" height="5"/><path d="M12 7v5M5 17v-3h14v3"/>',
  data:'<circle cx="6" cy="17" r="1.6"/><circle cx="10" cy="11" r="1.6"/><circle cx="15" cy="14" r="1.6"/><circle cx="19" cy="6" r="1.6"/><path d="M3 21h18M3 3v18"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/><path d="M7.5 5l9 4"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13"/><path d="M9 7V4h6v3M3 13h18"/>',
  chat:'<path d="M4 4h16v12H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  gift:'<rect x="3" y="9" width="18" height="12"/><path d="M3 13h18M12 9v12M12 9c-2-4-6-4-6-1s6 1 6 1zm0 0c2-4 6-4 6-1s-6 1-6 1z"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0 5 5l-9.4 9.4a2.1 2.1 0 0 1-3-3l9.4-9.4a4 4 0 0 1-2-2z"/>',
  repo:'<path d="M5 3h12v18H7a2 2 0 0 1-2-2z"/><path d="M5 17a2 2 0 0 1 2-2h10M9 7h4"/>'
};

/* ---------- storage (device only) ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
var cfg = (function(){ try{ return Object.assign({},DEFAULTS,JSON.parse(lsGet('ps-cfg')||'{}')); }catch(e){ return Object.assign({},DEFAULTS); } })();
var token = lsGet('ps-token') || '';
var DATA = null, SHA = null, syncedAt = null, syncState = 'off', lastError = '';
try{ var c=JSON.parse(lsGet('ps-cache')||'null'); if(c&&c.data){ DATA=c.data; SHA=c.sha; syncedAt=c.at; } }catch(e){}
var filter = lsGet('ps-filter') || 'all';
var feedAll = false;

/* ---------- GitHub API ---------- */
function apiUrl(){ return 'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/'); }
function headers(){ return {'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; }
function b64decode(s){ var bin=atob(s.replace(/\s/g,'')); var bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function b64encode(str){ var bytes=new TextEncoder().encode(str), bin=''; for(var i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(bin); }
function explain(status){
  if(status===401) return 'GitHub did not accept the token. Make a new one and paste it in Settings.';
  if(status===403) return 'The token is missing permission. It needs Contents: Read and write on '+cfg.repo+'.';
  if(status===404) return 'GitHub could not find '+cfg.owner+'/'+cfg.repo+'/'+cfg.path+'. Check the names in Settings, and that the token can see that repo.';
  return 'GitHub answered with error '+status+'. Try again in a minute.';
}
function fetchStatus(){
  return fetch(apiUrl()+'?t='+Date.now(),{headers:headers(),cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error(explain(r.status));
    return r.json();
  }).then(function(j){ return {data:JSON.parse(b64decode(j.content)), sha:j.sha}; });
}
var gen=0; // bumps on every save, so an older in-flight refresh cannot overwrite newer data
function keep(res){ DATA=res.data; SHA=res.sha; syncedAt=new Date().toISOString(); lsSet('ps-cache',JSON.stringify({data:DATA,sha:SHA,at:syncedAt})); }
function load(){
  if(!token){ render(); return Promise.resolve(); }
  setSync('busy'); var my=++gen;
  return fetchStatus().then(function(res){ if(my!==gen) return; keep(res); lastError=''; setSync('on'); render(); })
    .catch(function(e){ if(my!==gen) return; lastError = navigator.onLine===false ? 'You are offline. Showing the last saved copy.' : (e.message||'Could not reach GitHub.'); setSync(DATA?'warn':'off'); render(); });
}
/* read the newest file, apply the change, write it back; retry if someone else wrote in between */
function commitChange(mutate,message,tries){
  tries = tries||0;
  setSync('busy');
  return fetchStatus().then(function(res){
    mutate(res.data);
    res.data.updatedAt = new Date().toISOString();
    return fetch(apiUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},headers()),
      body:JSON.stringify({message:message+' (from phone)',content:b64encode(JSON.stringify(res.data,null,1)+'\n'),sha:res.sha})})
      .then(function(r){
        if(r.status===409 && tries<3) return commitChange(mutate,message,tries+1);
        if(!r.ok) throw new Error(explain(r.status));
        return r.json().then(function(j){ gen++; keep({data:res.data, sha:j.content.sha}); lastError=''; setSync('on'); render(); return true; });
      });
  }).catch(function(e){ lastError=e.message||'Could not save.'; setSync(DATA?'warn':'off'); render(); return false; });
}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function stages(){ return (DATA&&DATA.stages)||['Idea','Building','Testing','Review','Shipped']; }
function groups(){ return (DATA&&DATA.groups)||[]; }
function norm(p){
  function num(v,lo,hi){ v=Number(v); return isFinite(v)?Math.max(lo,Math.min(hi,Math.round(v))):lo; }
  var x=Object.assign({quests:[],about:[],features:[],stack:[],stats:[],attrs:[],achievements:[],where:[],timeline:[],log:[],doneQuests:{}},p);
  x.stage=num(x.stage,0,4); x.progress=num(x.progress,0,100); x.health=num(x.health,0,100); x.paused=!!x.paused;
  x.timeline = x.timeline.concat((x.log||[]).filter(function(l){return l&&l.date&&l.text;}).map(function(l){return [String(l.date),String(l.text)];}))
    .sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0;});
  if(x.timeline.length){ var last=x.timeline[x.timeline.length-1][0]; if(!x.lastActivity||last>x.lastActivity) x.lastActivity=last; }
  if(x.github && x.github.lastCommitDate && x.github.lastCommitDate.slice(0,10)>x.lastActivity) x.lastActivity=x.github.lastCommitDate.slice(0,10);
  if(x.local && x.local.lastCommitDate && x.local.lastCommitDate.slice(0,10)>x.lastActivity) x.lastActivity=x.local.lastCommitDate.slice(0,10);
  return x;
}
function all(){ return ((DATA&&DATA.projects)||[]).map(norm); }
function get(id){ var r=all().filter(function(p){return p.id===id;}); return r[0]||null; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysSince(ds){ if(!ds) return 99; var a=new Date(ds.slice(0,10)+'T12:00:00'), b=new Date(todayStr()+'T12:00:00'); return Math.max(0,Math.round((b-a)/864e5)); }
function ago(ds){ var n=daysSince(ds); return n===0?'today':n===1?'yesterday':n<60?n+' days ago':Math.round(n/30)+' months ago'; }
function agoTime(iso){ if(!iso) return 'never'; var m=Math.round((Date.now()-new Date(iso))/6e4); return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':ago(iso); }
function fmtDate(ds){ var d=new Date(ds.slice(0,10)+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function energy(p){ if(p.paused) return Math.max(5,40-daysSince(p.lastActivity)*3); return Math.max(5,100-daysSince(p.lastActivity)*9); }
function openQuests(p){ return p.quests.filter(function(q){return !p.doneQuests[q.id];}); }
function flagCount(p,f){ return openQuests(p).filter(function(q){return q.flag===f;}).length; }
function level(p){ return Math.max(1,Math.round((p.progress||0)/10)); }
function stageLabel(p){ return p.paused ? 'Paused' : stages()[p.stage]||'—'; }
function stageCls(p){ return p.paused ? 'st-p' : 'st-'+p.stage; }
function glyph(k){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+(G[k]||G.repo)+'</svg>'; }
function segs(kind,val,extra){ var v=Math.max(0,Math.min(100,+val||0)); return '<div class="meter '+kind+' '+(extra||'')+'" role="img" aria-label="'+v+' of 100"><i style="width:'+v+'%"></i></div>'; }
var RANKS=[[0,'Bronze'],[40,'Silver'],[60,'Gold'],[75,'Platinum'],[85,'Diamond'],[95,'Legend']];
function rankOf(v){ var cur=RANKS[0], next=RANKS[1]; for(var i=0;i<RANKS.length;i++){ if(v>=RANKS[i][0]){ cur=RANKS[i]; next=RANKS[i+1]||null; } } return {cur:cur,next:next}; }
function accentOf(p){ if(p.paused) return 'var(--purple)'; if(flagCount(p,'red')) return 'var(--bad)'; if(flagCount(p,'yellow')) return 'var(--yfill)'; return 'var(--good)'; }
function heroHTML(avg,sub,tiles,reds,alertHref){
  var rk=rankOf(avg);
  return '<section class="hero" aria-label="Summary"><div class="gauge" style="--v:'+avg+'"><div class="ticks"></div><div class="arc"></div><div class="knob"></div>'+
    '<div class="core"><b class="gnum" data-v="'+avg+'">'+avg+'<span>%</span></b><small>Overall progress</small></div></div>'+
    '<div class="rname">'+rk.cur[1]+'</div><p class="rsub">'+sub+'</p><div class="xpbar"><i style="width:'+avg+'%"></i></div>'+
    '<div class="xpl"><span>'+rk.cur[1]+' from '+rk.cur[0]+'%</span><span>'+(rk.next?rk.next[1]+' at '+rk.next[0]+'%':'Top rank reached')+'</span></div></section>'+
    '<div class="tiles">'+tiles.map(function(t){return '<div class="tile" style="--c:'+t[2]+'"><b>'+t[0]+'</b><span>'+t[1]+'</span></div>';}).join('')+'</div>'+
    (reds ? (alertHref?'<a class="alert" href="'+alertHref+'">':'<div class="alert">')+'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>'+reds+' critical quest'+(reds===1?' needs':'s need')+' you'+(alertHref?'</a>':'</div>') : '');
}
var gaugeDone=false;
function animateGauge(){
  if(gaugeDone) return; var el=document.querySelector('.gnum'); if(!el) return; gaugeDone=true;
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  var v=+el.getAttribute('data-v'), t0=null;
  function f(t){ t0=t0||t; var k=Math.min(1,(t-t0)/1200); if(el.firstChild) el.firstChild.nodeValue=Math.round(v*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); }
  requestAnimationFrame(f);
}
function hpClass(v){ return v<45?'low':v<70?'mid':''; }
function barsHTML(p){ var en=energy(p); return '<div class="bars">'+
  '<div class="barrow"><span>Progress</span>'+segs('xp',p.progress)+'<b>'+p.progress+'%</b></div>'+
  '<div class="barrow"><span>Health</span>'+segs('hp',p.health,hpClass(p.health))+'<b>'+p.health+'</b></div>'+
  '<div class="barrow"><span>Energy</span>'+segs('en',en)+'<b>'+en+'</b></div></div>'; }
function chip(v,l,cls){ return '<div class="chip '+(cls||'')+'"><b>'+v+'</b><span>'+l+'</span></div>'; }
function legend(){ return '<div class="legend"><span><i class="dia red"></i>Red: broken or risky</span><span><i class="dia yellow"></i>Yellow: should fix</span><span><i class="dia green"></i>Green: nice to have</span><span><i class="dia q"></i>Question</span></div>'; }
var ORDER={red:0,yellow:1,q:2,green:3};

/* ---------- views ---------- */
function viewConnect(){
  return '<section class="hud connect"><h1>Connect your data</h1>'+
    '<p class="sub" style="color:var(--muted);margin-top:6px">This app keeps no project data inside it. It reads your private <b>'+esc(cfg.owner)+'/'+esc(cfg.repo)+'</b> repo on GitHub, using a token that stays on this phone only.</p>'+
    '<ol><li>On GitHub, open Settings → Developer settings → Fine-grained tokens → <b>Generate new token</b>.</li>'+
    '<li>Repository access: <b>Only select repositories</b> → <code>'+esc(cfg.repo)+'</code>.</li>'+
    '<li>Permissions → Repository → <b>Contents: Read and write</b>. Then generate and copy it.</li>'+
    '<li>Paste it below and tap Connect.</li></ol>'+
    tokenForm()+'</section>';
}
function tokenForm(){
  return '<label class="field" for="sOwner">GitHub account<input type="text" id="sOwner" autocapitalize="off" autocomplete="off" spellcheck="false" value="'+esc(cfg.owner)+'"></label>'+
    '<label class="field" for="sRepo">Data repo<input type="text" id="sRepo" autocapitalize="off" autocomplete="off" spellcheck="false" value="'+esc(cfg.repo)+'"></label>'+
    '<label class="field" for="sToken">Token<input type="password" id="sToken" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="'+(token?'Saved on this device — paste to replace':'github_pat_…')+'"></label>'+
    '<div class="setrow"><button type="button" class="btn" id="sSave">'+(token?'Save and reload':'Connect')+'</button>'+(token?'<button type="button" class="btn danger" id="sForget">Remove token from this phone</button>':'')+'</div>'+
    (lastError?'<p class="err" role="alert">'+esc(lastError)+'</p>':'');
}
function viewBoard(){
  var ps=all(); if(!ps.length) return '<p style="margin-top:24px">No projects in the data file yet.</p>';
  var avg=Math.round(ps.reduce(function(s,p){return s+(p.progress||0);},0)/ps.length);
  var active=ps.filter(function(p){return !p.paused && p.stage>0 && p.stage<4;}).length;
  var reds=ps.reduce(function(s,p){return s+flagCount(p,'red');},0);
  var openAll=ps.reduce(function(s,p){return s+openQuests(p).length;},0);
  var doneAll=ps.reduce(function(s,p){return s+(p.quests.length-openQuests(p).length);},0);
  var shipped=ps.filter(function(p){return p.stage===4;}).length;
  var lastDay=ps.map(function(p){return p.lastActivity;}).sort().pop();
  var r=44, c=2*Math.PI*r, off=c*(1-avg/100);
  var h=heroHTML(avg, ps.length+' projects, last activity '+ago(lastDay)+', synced '+agoTime(syncedAt),
    [[ps.length,'projects','var(--cyan)'],[active,'in progress','var(--good)'],[reds,'red problems','var(--bad)'],[doneAll,'cleared','var(--gold)']], reds, '#quests');
  if(lastError) h+='<p class="err" role="alert">'+esc(lastError)+'</p>';
  if(DATA&&DATA.robotWarning) h+='<p class="err" role="status">GitHub robot: '+esc(DATA.robotWarning)+' Private projects will not update by themselves until the key is added.</p>';
  var gs=groups(), counts={all:ps.length};
  gs.forEach(function(g){counts[g.id]=ps.filter(function(p){return p.group===g.id;}).length;});
  h+='<div class="tabs" role="group" aria-label="Filter projects">'+[['all','All']].concat(gs.map(function(g){return [g.id,g.name];})).map(function(t){
    return '<button type="button" data-filter="'+t[0]+'" aria-pressed="'+(filter===t[0])+'">'+esc(t[1])+'<span>'+(counts[t[0]]||0)+'</span></button>'; }).join('')+'</div>';
  gs.forEach(function(g){
    if(filter!=='all' && filter!==g.id) return;
    var list=ps.filter(function(p){return p.group===g.id;}); if(!list.length) return;
    h+='<div class="section-h"><h2>'+esc(g.name)+'</h2><p>'+esc(g.note||'')+'</p></div><div class="grid '+(list.length===2||list.length===4?'g2':'g3')+'">'+list.map(card).join('')+'</div>';
  });
  var nr=(DATA&&DATA.newRepos)||[];
  if(nr.length){
    h+='<div class="section-h"><h2>New on GitHub</h2><p>Repos not on the board yet — ask Claude to add them</p></div><div class="grid g2">'+
      nr.map(function(r){return '<a class="hud newrepo" href="https://github.com/'+esc(cfg.owner)+'/'+esc(r.name)+'" target="_blank" rel="noopener"><div class="glyph">'+glyph('repo')+'</div><div><b>'+esc(r.name)+'</b><br><span>'+esc(r.description||'No description')+' — pushed '+ago(r.pushedAt)+'</span></div></a>';}).join('')+'</div>';
  }
  return h;
}
function card(p){
  var r=flagCount(p,'red'), y=flagCount(p,'yellow'), g=flagCount(p,'green')+flagCount(p,'q');
  return '<a class="hud card" href="#'+esc(p.id)+'" style="--c:'+accentOf(p)+'"><div class="card-top"><div class="glyph">'+glyph(p.glyph)+'</div><div><h3>'+esc(p.name)+'</h3><p class="cls">'+esc(p.cls)+'</p></div><div class="lv"><small>Level</small><b>'+level(p)+'</b></div></div>'+
    '<div><span class="stagepill '+stageCls(p)+'">'+stageLabel(p)+'</span></div><p class="tagline">'+esc(p.tagline)+'</p>'+barsHTML(p)+
    '<div class="card-foot"><div class="flags"><span class="flag"><i class="dia red"></i>'+r+'</span><span class="flag"><i class="dia yellow"></i>'+y+'</span><span class="flag"><i class="dia green"></i>'+g+'</span></div>'+
    '<span style="margin-left:auto">'+(p.repo?'On GitHub, ':'Only on the Mac, ')+'active '+ago(p.lastActivity)+'</span><p class="next"><em>Next:</em> '+esc(p.next)+'</p></div></a>';
}
function questRow(p,q,showTag){
  var done=!!p.doneQuests[q.id], can=!!token;
  var tick = can ? '<button type="button" class="tick" role="checkbox" aria-checked="'+done+'" aria-label="Mark as done" data-p="'+esc(p.id)+'" data-q="'+esc(q.id)+'">'+(done?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>':'')+'</button>' : '<i class="dia '+q.flag+'"></i>';
  return '<li class="q'+(done?' done':'')+'">'+tick+'<div><p>'+(can?'<i class="dia '+q.flag+'" style="margin-right:8px;vertical-align:1px"></i>':'')+esc(q.text)+'</p>'+(q.who?'<small>'+esc(q.who)+'</small>':'')+'</div>'+
    (showTag?'<a class="tag" href="#'+esc(p.id)+'">'+esc(p.name)+'</a>':'<span></span>')+'</li>';
}
function viewQuests(){
  var qs=[]; all().forEach(function(p){ openQuests(p).forEach(function(q){qs.push({p:p,q:q});}); });
  qs.sort(function(a,b){return ORDER[a.q.flag]-ORDER[b.q.flag];});
  return '<div class="section-h"><h2>Quest board</h2><p>Everything still open, most urgent first</p></div><section class="hud panel">'+legend()+
    '<ul class="qlist">'+(qs.length?qs.map(function(x){return questRow(x.p,x.q,true);}).join(''):'<li class="q"><span></span><p>All clear.</p></li>')+'</ul><p class="note">Tick a quest to mark it done. It saves to GitHub and shows on every device.</p></section>';
}
function viewLog(){
  var feed=[]; all().forEach(function(p){ p.timeline.forEach(function(t){feed.push({p:p,d:t[0],t:t[1]});}); });
  feed.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0;});
  var shown=feedAll?feed:feed.slice(0,25);
  return '<div class="section-h"><h2>Activity log</h2><p>Newest first'+(DATA&&DATA.syncedFromGitHubAt?', newest GitHub commit seen '+agoTime(DATA.syncedFromGitHubAt):'')+'</p></div><section class="hud panel"><ul class="feed">'+
    shown.map(function(f){return '<li><time>'+fmtDate(f.d)+'</time><p><a href="#'+esc(f.p.id)+'">'+esc(f.p.name)+'</a> '+esc(f.t)+'</p></li>';}).join('')+'</ul>'+
    (feed.length>25?'<button type="button" class="showmore" id="feedMore">'+(feedAll?'Show less':'Show all '+feed.length+' entries')+'</button>':'')+'</section>';
}
function viewSettings(){
  var mode=lsGet('ps-theme')||'auto';
  return '<div class="section-h"><h2>Settings</h2><p>Saved on this phone only</p></div>'+
    '<section class="hud panel"><h2>Colour mode</h2><div class="mode" role="group" aria-label="Colour mode" style="margin-top:10px">'+
    ['auto','light','dark'].map(function(m){return '<button type="button" data-mode="'+m+'" aria-pressed="'+(mode===m)+'">'+(m==='auto'?'Match phone':m[0].toUpperCase()+m.slice(1))+'</button>';}).join('')+'</div></section>'+
    '<section class="hud panel" style="margin-top:14px"><h2>GitHub connection</h2><p class="hint">Status file: '+esc(cfg.owner)+'/'+esc(cfg.repo)+'/'+esc(cfg.path)+'. Last synced '+agoTime(syncedAt)+'.</p>'+tokenForm()+'</section>'+
    '<section class="hud panel" style="margin-top:14px"><h2>Install on iPhone</h2><p class="hint" style="margin:6px 0 0">In Safari tap Share, then "Add to Home Screen". The app then opens full screen and works offline with the last synced copy.</p></section>';
}
function radar(attrs){
  var n=attrs.length; if(n<3) return '';
  var cx=170, cy=150, R=100, pts=[], rings='', axes='', labels='';
  function pt(i,v){ var a=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(a)*R*v/10, cy+Math.sin(a)*R*v/10]; }
  [2,4,6,8,10].forEach(function(v){ var ring=[]; for(var i=0;i<n;i++) ring.push(pt(i,v).map(function(x){return x.toFixed(1);}).join(',')); rings+='<polygon points="'+ring.join(' ')+'" fill="none" stroke="var(--line)"/>'; });
  for(var i=0;i<n;i++){ var e=pt(i,10), l=pt(i,12.6), v=attrs[i][1];
    axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--line)"/>';
    var anchor=Math.abs(l[0]-cx)<8?'middle':(l[0]>cx?'start':'end');
    labels+='<text x="'+l[0].toFixed(1)+'" y="'+l[1].toFixed(1)+'" text-anchor="'+anchor+'" dominant-baseline="middle">'+esc(attrs[i][0])+' <tspan class="val">'+v+'</tspan></text>';
    pts.push(pt(i,Math.max(v,0.3)).map(function(x){return x.toFixed(1);}).join(',')); }
  return '<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="Skill chart">'+rings+axes+'<polygon points="'+pts.join(' ')+'" fill="color-mix(in srgb,var(--purple) 28%,transparent)" stroke="var(--purple)" stroke-width="2"/>'+labels+'</svg>';
}
function ghHTML(p){
  var g=p.github, l=p.local, h='';
  if(g) h+='<div class="ghbox"><b>GitHub</b>: '+(g.commits!=null?g.commits+' commits, ':'')+'last push '+ago(g.pushedAt||g.lastCommitDate)+(g.lastMessage?'<br>“'+esc(g.lastMessage)+'”':'')+'<br><a href="https://github.com/'+esc(cfg.owner)+'/'+esc(p.repo)+'" target="_blank" rel="noopener">Open on GitHub</a></div>';
  if(l) h+='<div class="ghbox"><b>On the Mac</b>: '+(l.commits!=null?l.commits+' commits, ':'')+'last commit '+ago(l.lastCommitDate)+(l.lastMessage?'<br>“'+esc(l.lastMessage)+'”':'')+'</div>';
  return h;
}
function viewDetail(p){
  var S=stages(), r=flagCount(p,'red');
  var h='<a class="back" href="#">&#8592; All projects</a>';
  h+='<section class="hud dhead" style="--c:'+accentOf(p)+'"><span class="bgnum" aria-hidden="true">'+level(p)+'</span><div class="glyph">'+glyph(p.glyph)+'</div><div><h1>'+esc(p.name)+'</h1><p class="cls">'+esc(p.cls)+' &nbsp;<span class="stagepill '+stageCls(p)+'">'+stageLabel(p)+'</span></p><p class="tagline">'+esc(p.tagline)+'</p></div>'+
    '<div class="dlv"><small>Level</small><b class="num">'+level(p)+'</b><small>active '+ago(p.lastActivity)+'</small></div></section>';
  h+='<div class="track">'+S.map(function(s,i){return '<div class="'+(i<p.stage?'done':i===p.stage?'now':'')+'">'+esc(s)+'</div>';}).join('')+'</div>';
  h+='<div class="dgrid"><div class="col">';
  h+='<section class="hud panel prose"><h2>What it is</h2>'+p.about.map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</section>';
  h+='<section class="hud panel"><h2>Open quests</h2>'+legend()+'<ul class="qlist">'+p.quests.map(function(q){return questRow(p,q,false);}).join('')+'</ul></section>';
  h+='<section class="hud panel"><h2>What it can do</h2><ul class="list">'+p.features.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul></section>';
  h+='<section class="hud panel"><h2>Achievements unlocked</h2><div class="ach">'+p.achievements.map(function(a){return '<div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6.3 6.9.9-5 4.8 1.2 6.9L12 17.7 5.9 21l1.2-6.9-5-4.8 6.9-.9z"/></svg>'+esc(a)+'</div>';}).join('')+'</div></section>';
  h+='<section class="hud panel"><h2>Timeline</h2><ul class="feed" style="margin-top:10px">'+p.timeline.slice().reverse().map(function(t){return '<li><time>'+fmtDate(t[0])+'</time><p>'+esc(t[1])+'</p></li>';}).join('')+'</ul></section>';
  h+='</div><div class="col">';
  h+='<section class="hud panel"><h2>Stats</h2>'+barsHTML(p)+'<div class="statgrid">'+p.stats.map(function(s){return '<div><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>';}).join('')+'</div>'+ghHTML(p)+'</section>';
  h+='<section class="hud panel"><h2>Skill chart</h2><p class="hint">Each skill scored 0–10</p>'+radar(p.attrs)+'</section>';
  h+='<section class="hud panel nextmove"><h2>Next move</h2><p style="margin-top:6px">'+esc(p.next)+'</p></section>';
  h+='<section class="hud panel'+(r?' boss':'')+'"><h2>'+(r?'Boss fight':'Main blocker')+'</h2><p style="margin-top:6px">'+esc(p.boss)+'</p></section>';
  h+='<section class="hud panel"><h2>Gear</h2><div class="gear">'+p.stack.map(function(s){return '<span>'+esc(s[0])+(s[1]?'<small>'+esc(s[1])+'</small>':'')+'</span>';}).join('')+'</div></section>';
  h+='<section class="hud panel"><h2>Where it lives</h2><dl class="kv">'+p.where.map(function(w){return '<dt>'+esc(w[0])+'</dt><dd>'+esc(w[1])+'</dd>';}).join('')+'</dl>'+(p.run?'<pre><code>'+esc(p.run)+'</code></pre>':'')+'</section>';
  if(token) h+=editorHTML(p);
  return h+'</div></div>';
}
function editorHTML(p){
  return '<section class="hud panel editor"><h2>Update status</h2><p class="hint">Saves to GitHub; every device sees it.</p>'+
    '<label class="field" for="eStage">Stage<select id="eStage">'+stages().map(function(s,i){return '<option value="'+i+'"'+(i===p.stage?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select></label>'+
    '<label class="field" for="eProg">Progress <b id="eProgV" class="num">'+p.progress+'%</b><input type="range" id="eProg" min="0" max="100" step="5" value="'+p.progress+'"></label>'+
    '<label class="field" for="eHealth">Health <b id="eHealthV" class="num">'+p.health+'</b><input type="range" id="eHealth" min="0" max="100" step="5" value="'+p.health+'"></label>'+
    '<label class="field row" for="ePaused"><input type="checkbox" id="ePaused"'+(p.paused?' checked':'')+'> Paused</label>'+
    '<label class="field" for="eNext">Next move<textarea id="eNext" rows="3">'+esc(p.next)+'</textarea></label>'+
    '<label class="field" for="eLog">Add to timeline (optional)<input type="text" id="eLog" placeholder="e.g. Finished Task 11"></label>'+
    '<div class="row" style="margin-top:14px"><button type="button" class="btn" id="eSave" data-p="'+esc(p.id)+'">Save status</button><span class="saved" id="eMsg" role="status"></span></div></section>';
}

/* ---------- router ---------- */
var app=document.getElementById('app'), lastRoute=null;
function route(){ return (location.hash||'').replace('#',''); }
function render(){
  var id=route(), y=window.scrollY, html, tab='board';
  if(!token && id!=='settings'){ html=viewConnect(); tab='settings'; }
  else if(id==='settings'){ html=viewSettings(); tab='settings'; }
  else if(id==='quests'){ html=viewQuests(); tab='quests'; }
  else if(id==='log'){ html=viewLog(); tab='log'; }
  else if(id && get(id)){ html=viewDetail(get(id)); }
  else if(!DATA){ html='<p style="margin-top:24px">Loading from GitHub…</p>'+(lastError?'<p class="err">'+esc(lastError)+'</p>':''); }
  else html=viewBoard();
  var ae=document.activeElement;
  if(ae && ae.closest && ae.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && lastRoute===id) return; // don't wipe typing
  app.innerHTML=html; animateGauge();
  document.querySelectorAll('.tabbar a').forEach(function(a){ if(a.getAttribute('data-tab')===tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  var reds=all().reduce(function(s,p){return s+flagCount(p,'red');},0), b=document.getElementById('qBadge');
  b.hidden=!reds; b.textContent=reds;
  window.scrollTo(0, lastRoute===id ? y : 0); lastRoute=id;
}
window.addEventListener('hashchange',render);

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-filter]');
  if(t){ filter=t.getAttribute('data-filter'); lsSet('ps-filter',filter); render(); return; }
  if(e.target.closest('#feedMore')){ feedAll=!feedAll; render(); return; }
  var m=e.target.closest('[data-mode]');
  if(m){ applyMode(m.getAttribute('data-mode')); render(); return; }
  var tk=e.target.closest('.tick');
  if(tk){ e.preventDefault(); var pid=tk.getAttribute('data-p'), qid=tk.getAttribute('data-q'); tk.disabled=true;
    commitChange(function(d){ var p=d.projects.filter(function(x){return x.id===pid;})[0]; if(!p) return; p.doneQuests=p.doneQuests||{}; if(p.doneQuests[qid]) delete p.doneQuests[qid]; else p.doneQuests[qid]=true; }, 'Update quest '+qid+' on '+pid); return; }
  if(e.target.closest('#sSave')){
    var o=document.getElementById('sOwner').value.trim(), rp=document.getElementById('sRepo').value.trim(), tv=document.getElementById('sToken').value.trim();
    cfg.owner=o||DEFAULTS.owner; cfg.repo=rp||DEFAULTS.repo; lsSet('ps-cfg',JSON.stringify({owner:cfg.owner,repo:cfg.repo}));
    if(tv){ token=tv; lsSet('ps-token',tv); }
    lastError=''; document.activeElement&&document.activeElement.blur();
    if(location.hash==='#settings'||!location.hash) location.hash=''; load(); return;
  }
  if(e.target.closest('#sForget')){ token=''; lsSet('ps-token',null); lsSet('ps-cache',null); DATA=null; SHA=null; setSync('off'); render(); return; }
  var sv=e.target.closest('#eSave');
  if(sv){ var pid2=sv.getAttribute('data-p');
    var f={stage:+document.getElementById('eStage').value, progress:+document.getElementById('eProg').value, health:+document.getElementById('eHealth').value,
      paused:document.getElementById('ePaused').checked, next:document.getElementById('eNext').value.trim(), lastActivity:todayStr()};
    var logTxt=document.getElementById('eLog').value.trim();
    sv.disabled=true; document.activeElement&&document.activeElement.blur();
    commitChange(function(d){ var p=d.projects.filter(function(x){return x.id===pid2;})[0]; if(!p) return;
      Object.keys(f).forEach(function(k){ if(k==='next'&&!f[k]) return; p[k]=f[k]; });
      if(logTxt){ p.log=p.log||[]; p.log.push({date:todayStr(),text:logTxt}); } }, 'Update status of '+pid2)
      .then(function(ok){ var msg=document.getElementById('eMsg'); if(msg) msg.textContent=ok?'Saved':'Not saved — '+lastError; });
  }
});
app.addEventListener('input',function(e){
  if(e.target.id==='eProg') document.getElementById('eProgV').textContent=e.target.value+'%';
  if(e.target.id==='eHealth') document.getElementById('eHealthV').textContent=e.target.value;
});
document.getElementById('refresh').addEventListener('click',function(){ load(); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible' && token && (!syncedAt || Date.now()-new Date(syncedAt)>30000)) load(); });
window.addEventListener('online',function(){ load(); });
setInterval(function(){ if(document.visibilityState==='visible' && token) load(); }, 120000);

/* ---------- sync pill + theme ---------- */
function setSync(s){
  syncState=s; var el=document.getElementById('live'), tx=document.getElementById('liveText'), rb=document.getElementById('refresh');
  el.className='live'+(s==='on'?' on':s==='warn'?' warn':'');
  tx.textContent = s==='on'?'Synced':s==='busy'?'Syncing…':s==='warn'?'Saved copy':'Offline';
  rb.classList.toggle('spin',s==='busy');
}
function applyMode(m){
  var root=document.documentElement;
  if(m==='light'||m==='dark'){ root.setAttribute('data-theme',m); lsSet('ps-theme',m); } else { root.removeAttribute('data-theme'); lsSet('ps-theme',null); }
  var dark = root.getAttribute('data-theme')==='dark' || (!root.getAttribute('data-theme') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark?'#05060B':'#EDF1FB');
}
applyMode(lsGet('ps-theme')||'auto');

if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
setSync(DATA?'warn':'off');
render();
load();
})();
</script>
</body>
